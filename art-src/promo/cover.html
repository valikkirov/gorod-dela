<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:local('Inter')}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
.bg{position:absolute;inset:0;background:url(cover-street.png) center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0) 45%,rgba(40,30,15,.18) 100%)}
.card{position:absolute;right:30px;top:50%;transform:translateY(-50%);width:350px;padding:30px 32px 32px;background:rgba(251,249,244,.95);border-radius:28px;box-shadow:0 18px 50px rgba(40,30,10,.35);font-family:Inter,system-ui,'DejaVu Sans',sans-serif;color:#2d2a26}
h1{margin:0;font-size:66px;line-height:.95;letter-spacing:-2px;font-weight:800}
h1 span{color:#d0603a}
p{margin:18px 0 0;font-size:21px;line-height:1.3;color:#5a5249}
.tag{display:inline-block;margin-top:24px;padding:10px 18px;border-radius:999px;background:#d0603a;color:#fff;font-weight:700;font-size:18px}
</style></head><body><div class="bg"></div><div class="shade"></div>
<div class="card"><h1>Город<br><span>дела</span></h1>
<p>Открой кофейню или киоск на&nbsp;живой улице. Жители помнят твоё меню, цены и&nbsp;очереди.</p>
<div class="tag">Маленькое дело. Живая улица.</div></div></body></html>
