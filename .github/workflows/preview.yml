name: Превью ветки

# Сборка ветки → папка preview/<ветка>/ в бакете Яндекса. Запускается по команде, а не на каждый пуш —
# так экономятся минуты Actions: gh api -X POST repos/valikkirov/gorod-dela/actions/workflows/preview.yml/dispatches -f ref=<ветка>
# Основная игра не меняется; сохранения превью хранятся отдельно (см. SAVE_NS в challenge.ts).
on:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      BUCKET: gorod-dela-play
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      ENDPOINT: https://storage.yandexcloud.net
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Тесты гоняются перед пушем и в деплое main — в превью их не повторяем
      - run: npm run build
      - name: Выкладка превью
        run: >
          aws s3 sync dist "s3://$BUCKET/preview/$GITHUB_REF_NAME"
          --endpoint-url "$ENDPOINT"
          --cache-control "no-cache"
          --delete
      - name: Ссылка
        run: echo "Превью → https://$BUCKET.website.yandexcloud.net/preview/$GITHUB_REF_NAME/" >> "$GITHUB_STEP_SUMMARY"
