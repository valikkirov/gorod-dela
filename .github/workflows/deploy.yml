name: Деплой в Yandex Object Storage

# Каждый пуш в main: тесты → сборка → загрузка в бакет.
# Игра: https://gorod-dela-play.website.yandexcloud.net
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  BUCKET: gorod-dela-play
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ru-central1
  ENDPOINT: https://storage.yandexcloud.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Файлы в assets/ с хешем в имени — кешируем надолго.
      - name: Загрузка ассетов
        run: >
          aws s3 sync dist/assets "s3://$BUCKET/assets"
          --endpoint-url "$ENDPOINT"
          --cache-control "public, max-age=31536000, immutable"

      # index.html и прочее — без кеша, чтобы игроки сразу получали новую версию.
      # --delete убирает старые сборки из бакета.
      - name: Загрузка страницы
        run: >
          aws s3 sync dist "s3://$BUCKET"
          --endpoint-url "$ENDPOINT"
          --cache-control "no-cache"
          --exclude "assets/*"
          --delete

      - name: Очистка старых ассетов
        run: >
          aws s3 sync dist/assets "s3://$BUCKET/assets"
          --endpoint-url "$ENDPOINT"
          --delete

      - name: Ссылка
        run: echo "Готово → https://$BUCKET.website.yandexcloud.net" >> "$GITHUB_STEP_SUMMARY"
