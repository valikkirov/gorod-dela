name: Деплой в Yandex Object Storage и зеркало в Selectel

# Каждый пуш в main: тесты → сборка → выкладка в два облака независимо друг от друга.
# Основной адрес: https://gorod-dela-play.website.yandexcloud.net
# Зеркало (Selectel) включается само, когда в настройках репозитория заданы
# переменная SELECTEL_BUCKET и секреты SELECTEL_ACCESS_KEY_ID / SELECTEL_SECRET_ACCESS_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 90

  yandex:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUCKET: gorod-dela-play
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      ENDPOINT: https://storage.yandexcloud.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Файлы в assets/ с хешем в имени — кешируем надолго.
      - name: Загрузка ассетов
        run: >
          aws s3 sync dist/assets "s3://$BUCKET/assets"
          --endpoint-url "$ENDPOINT"
          --cache-control "public, max-age=31536000, immutable"

      # index.html и прочее — без кеша, чтобы игроки сразу получали новую версию.
      # --delete убирает старые сборки из бакета (папку превью не трогаем).
      - name: Загрузка страницы
        run: >
          aws s3 sync dist "s3://$BUCKET"
          --endpoint-url "$ENDPOINT"
          --cache-control "no-cache"
          --exclude "assets/*"
          --exclude "preview/*"
          --delete

      - name: Очистка старых ассетов
        run: >
          aws s3 sync dist/assets "s3://$BUCKET/assets"
          --endpoint-url "$ENDPOINT"
          --delete

      - name: Ссылка
        run: echo "Яндекс → https://$BUCKET.website.yandexcloud.net" >> "$GITHUB_STEP_SUMMARY"

  selectel:
    needs: build
    if: vars.SELECTEL_BUCKET != ''
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.SELECTEL_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SELECTEL_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SELECTEL_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.SELECTEL_REGION || 'ru-1' }}
      ENDPOINT: ${{ vars.SELECTEL_ENDPOINT || 'https://s3.ru-1.storage.selcloud.ru' }}
      # Новые aws cli шлют контрольные суммы, которые S3-совместимые хранилища не всегда принимают
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Загрузка ассетов
        run: >
          aws s3 sync dist/assets "s3://$BUCKET/assets"
          --endpoint-url "$ENDPOINT"
          --cache-control "public, max-age=31536000, immutable"

      - name: Загрузка страницы
        run: >
          aws s3 sync dist "s3://$BUCKET"
          --endpoint-url "$ENDPOINT"
          --cache-control "no-cache"
          --exclude "assets/*"
          --exclude "preview/*"
          --delete

      - name: Очистка старых ассетов
        run: >
          aws s3 sync dist/assets "s3://$BUCKET/assets"
          --endpoint-url "$ENDPOINT"
          --delete

      - name: Ссылка
        run: echo "Selectel → бакет $BUCKET выложен" >> "$GITHUB_STEP_SUMMARY"
