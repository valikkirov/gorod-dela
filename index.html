<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Город дела — прототип</title>
    <script>
      // Одна игра — один адрес: сохранения в браузере привязаны к адресу, поэтому www ведёт на основной
      if (location.hostname === 'www.gorod-dela.ru') location.replace('https://gorod-dela.ru' + location.pathname + location.search + location.hash);
    </script>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="brand"><b>Город дела</b><small>Маленькое дело. Живая улица.</small></div>
        <div id="clock">День 1 · 06:00</div>
        <div id="speeds"></div>
        <div id="cash"></div>
      </header>
      <main id="game">
        <div id="street-note" aria-live="polite"></div>
        <div id="zoom">
          <button id="sound" aria-label="Включить звук" title="Звук">🔇</button>
          <button data-zoom="in" aria-label="Приблизить">+</button>
          <button data-zoom="out" aria-label="Отдалить">−</button>
          <button data-zoom="fit" aria-label="Вся улица">⤢</button>
        </div>
      </main>
      <section id="drawer" data-size="peek">
        <div id="grip" role="button" aria-label="Развернуть панель"></div>
        <div id="panel"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
