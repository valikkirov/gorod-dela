<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Город дела — прототип</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="clock">День 1 · 06:00</div>
        <div id="speeds"></div>
        <div id="cash"></div>
      </header>
      <main id="game">
        <div id="zoom">
          <button data-zoom="in" aria-label="Приблизить">+</button>
          <button data-zoom="out" aria-label="Отдалить">−</button>
          <button data-zoom="fit" aria-label="Вся улица">⤢</button>
        </div>
      </main>
      <section id="drawer" data-size="peek">
        <div id="grip" role="button" aria-label="Развернуть панель"></div>
        <div id="panel"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
